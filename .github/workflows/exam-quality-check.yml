name: Exam quality checks

on:
  push:
    branches:
      - codex/fix-exam-layout-and-figures

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt pillow
      - run: npm run typecheck
      - run: node scripts/run-ts.mjs scripts/check_layout_quality.ts
      - run: node scripts/run-ts.mjs scripts/check_multiple_figures.ts
      - run: python scripts/check_source_hwpx.py
      - run: python scripts/check_multiple_figures_hwpx.py
      - run: python scripts/check_editable_header.py
      - run: python scripts/check_safe_layout.py
      - run: python scripts/check_hwpx_text.py
      - run: python scripts/check_staged_hwpx.py
      - run: npm run build
      - name: Six pages and thirty figures without AI calls
        env:
          EXAM_STORE: local
          APP_INITIAL_PASSWORD: exam-local-test
        run: |
          npm run dev -- -p 3198 > /tmp/exam-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3198/login >/dev/null; then break; fi
            sleep 2
          done
          python scripts/check_large_conversion.py
